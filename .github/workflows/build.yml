name: Haskell CI

on:
  push:
    branches: [ "main", "ci" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read



jobs:
  build-cache:
    runs-on: ubuntu-latest
    container:
      image: haskell:9.8.4
    steps: 
      - uses: actions/checkout@v4

      - name: Cache Cabal
        id: cache-cabal
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cache
            /github/home/.config
            /github/home/.local
          key: ${{ runner.os }}-${{ hashFiles('**/cabal.project') }}-${{ hashFiles('**/*.cabal') }}

      - name: Install dependencies
        run: |
          cabal update

      - name: Build dependencies
        run: |
          cabal build --only-dependencies --enable-tests --enable-benchmarks

      - name: Install skeletest-preprocessor
        run: |
          cabal install skeletest --installdir=$HOME/.local/bin --install-method=copy --overwrite-policy=always

      - name: Check Cache
        run: |
          ls -ahl /github/home/
          ls -ahl /github/home/.cache
          ls -ahl /github/home/.config
          ls -ahl /github/home/.local

  build-982:
    needs: build-cache
    runs-on: ubuntu-latest
    container:
      image: haskell:9.8.4
    steps: 
      - uses: actions/checkout@v4

      - name: Cache Cabal Restore
        id: cache-cabal-restore
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cache
            /github/home/.config
            /github/home/.local
          key: ${{ runner.os }}-${{ hashFiles('**/cabal.project') }}-${{ hashFiles('**/*.cabal') }}

      - name: Check Cache
        run: |
          ls -ahl /github/home/
          ls -ahl /github/home/.cache
          ls -ahl /github/home/.config
          ls -ahl /github/home/.local

      - name: Source skeletest-preprocessor
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: cabal build --enable-tests --enable-benchmarks all

      - name: Test
        run: cabal test
